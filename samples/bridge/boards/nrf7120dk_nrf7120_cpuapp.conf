# Lower System ON idle current: see lib_nrf71_idle_power. Keep the
# default RAM_RETAIN_FULL tier; RAM_RETAIN_UNUSED_ONLY has been observed
# to cause issues on Wi-Fi builds.
CONFIG_NRF71_IDLE_POWER=y

# Set 10 BLE connections, as it is an upper limit supported caused by RAM usage due to using Thread and BLE at same time.
CONFIG_BT_MAX_CONN=10

# Decrease BT buffer sizes to free some RAM and support 10 Bluetooth LE connections
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69

# Set MTU size to fit in the single buffer and avoid fragmentation (BUF_SIZE = MTU_SIZE + 4 B of L2CAP header).
CONFIG_BT_L2CAP_TX_MTU=65

# Increase BT RX stack size due to BT security usage
CONFIG_BT_RX_STACK_SIZE=2560

# Set max number of bridged Bluetooth LE devices, which is CONFIG_BT_MAX_CONN-1, as 1 connection is reserved for Matter.
CONFIG_BRIDGE_MAX_BRIDGED_DEVICES_NUMBER=9
CONFIG_BT_MAX_PAIRED=9

# Assume that every bridged device uses two endpoints, however it can be increased if specific use case requires it.
CONFIG_BRIDGE_MAX_DYNAMIC_ENDPOINTS_NUMBER=18

# TODO: MCUboot is currently not supported on the nRF7120 DK.
CONFIG_CHIP_BOOTLOADER_NONE=y

# TODO: Currently MRAM does not support clearing factory data, so we can not
# migrate the DAC private key
CONFIG_CHIP_CRYPTO_PSA_MIGRATE_DAC_PRIV_KEY=n

# TODO: Enabling low-power mode unconditionally gives BLE more radio time,
# allowing the device to connect to Wi-Fi and send responses over BLE.
CONFIG_NRF_WIFI_LOW_POWER=y

# Enable full SHELL support to improve user experience
CONFIG_SHELL_MINIMAL=n

# TODO: Enable experimental ANT-SW support for nRF7120 DK.
CONFIG_MPSL_DYNAMIC_INTERRUPTS=n
CONFIG_MPSL_NRF71_ANTSW=y
