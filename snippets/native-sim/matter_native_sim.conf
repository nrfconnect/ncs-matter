# --- Strip nRF / production-only features ---
CONFIG_DK_LIBRARY=n
CONFIG_PWM=n
CONFIG_MPU_STACK_GUARD=n
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_CHIP_FACTORY_DATA_NONE=y
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_IMG_MANAGER=n
CONFIG_CHIP_OTA_REQUESTOR=y
CONFIG_CHIP_OTA_REQUESTOR_REBOOT_ON_APPLY=y
CONFIG_STREAM_FLASH=y
CONFIG_OPENTHREAD=n
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Use the native_sim specific project configuration
CONFIG_CHIP_PROJECT_CONFIG="${ZEPHYR_NCS_MATTER_MODULE_DIR}/snippets/native-sim/chip_project_config_native_sim.h"

# --- Host platform / CHIP ---
CONFIG_REBOOT=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=n
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_FLASH_SIMULATOR=y

# SPAKE2P via mbedtls on native_sim: PSA path needs psa_pake_* driver (link fail on host).
# Larger heap avoids ecp_muladd failures during PASE Pake1 (CHIP_ERROR_INTERNAL / 0xac).
CONFIG_CHIP_CRYPTO_SPAKE2P_MBEDTLS=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_MBEDTLS_MD_C=y
CONFIG_CHIP_SYSTEM_USE_ZEPHYR_SOCKET_EXTENSIONS=n

# PSA crypto: PlatformManagerImpl skips add_entropy_source when MBEDTLS_ENTROPY_POLL_ZEPHYR is set (see subsys/Kconfig).
CONFIG_PSA_CRYPTO=y

# --- IP over host Ethernet (BSD sockets / getifaddrs); no BLE / HCI ---
CONFIG_BT=n
CONFIG_CHIP_BLE_EXT_ADVERTISING=n
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15
CONFIG_BT_DEVICE_NAME=""

# --- Test harness ---
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_SHELL=y
CONFIG_CHIP_LIB_SHELL=y
CONFIG_MATTER_TEST_SHELL=y
CONFIG_UART_NATIVE_PTY=y

# native_sim defaults LOG_RUNTIME_DEFAULT_LEVEL=1 (ERR only). Matter ChipLogProgress/Detail
# map to Zephyr LOG_INF/LOG_DBG — invisible without raising this.
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4

# UART0 on stdin/stdout; logs and shell share this terminal.
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=n
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Verbose Matter protocol logs (PASE/IM) during on-network commissioning debug.
CONFIG_CHIP_LOG_SIZE_OPTIMIZATION=n
CONFIG_CHIP_IM_PRETTY_PRINT=y

# Keep Matter at DBG/INF; silence Zephyr kernel mutex spam (os module follows KERNEL_LOG_LEVEL).
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_SETTINGS_LOG_LEVEL_WRN=y
CONFIG_ZMS_LOG_LEVEL_WRN=y

# ZMS backend on 42 KiB storage (overlay); 10 × 4 KiB erase sectors fit in partition.
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_CUSTOM_SECTOR_COUNT=y
CONFIG_SETTINGS_ZMS_SECTOR_COUNT=10
