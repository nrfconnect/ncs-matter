          - nrf5340dk/nrf5340/cpuapp
          - nrf54l15dk/nrf54l15/cpuapp
      - scenario_prefix: applications.matter_weather_station
        variants:
          - debug
        platform:
          - thingy53/nrf5340/cpuapp

# PR label behavior. Labels are matched case-insensitively.
labels:
  ci-all-test:
    action: full_build
  ci-disabled:
    action: skip

# Branch, tag, and scheduled builds run the full integration scope by default.
non_pr:
  action: full_build

# When a PR has changes but no path trigger matches, still build always_build scenarios.
fallback:
  action: always_build
