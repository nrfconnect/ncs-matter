version: 1

# On-demand full variant runs via PR comment:
#   /matter.<sample_dir>.<variant>
# Example: /matter.smoke_co_alarm.debug runs all integration_platforms from that scenario in sample.yaml,
# in addition to the normal selective plan for the PR.
#
# Twister defaults used when generating a selective build plan.
# scenario_prefix is prepended to each sample's scenario name (unless scenario already contains '.').
#
# west-allowlist points (relative to this file) at a YAML list of project names CI should
# scope `west update` to (see west_allowlist.yaml). Empty/omitted means no scoping - CI updates
# every project west.yml's own import pulls in, same as a local development workspace.
twister:
  integration: true
  testcase_root: samples
  scenario_prefix: sample.matter.
  west-allowlist: west_allowlist.yaml

# Scenarios always included in PR builds (in addition to path trigger matches).
# The scenarios here must reflect the integration scope of the project.
# platform: [] or omitted means all platforms allowed by the scenario in sample.yaml.
always_build:
  - scenario: template
    variants:
      - smp_dfu
    platform:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
  - scenario: template
    variants:
      - nrf7002eb2.smp_dfu
    platform:
      - nrf54lm20dk/nrf54lm20b/cpuapp

# Changes to these paths trigger a full integration build of all samples.
full_build_paths:
  - west.yml
  - .github/**
  - CMakeLists.txt
  - Kconfig
  - Kconfig.*

# Map changed paths to one or more samples/variants/platforms.
