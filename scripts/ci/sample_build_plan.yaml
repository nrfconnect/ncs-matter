  matter-weather-station-sample:
    paths:
      - samples/matter_weather_station/**/*.{c,h,cpp,hpp,yml,yaml}
    samples:
      - scenario_prefix: applications.matter_weather_station
        variants:
          - release
        platform:
          - thingy53/nrf5340/cpuapp
          - nrf54l15tag/nrf54l15/cpuapp

  # ---------------------------------------------------------------------------
  # Subsys path triggers — one representative sample per subsys area
  # ---------------------------------------------------------------------------
  subsys-common:
    paths:
      - subsys/CMakeLists.txt
      - subsys/Kconfig
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - debug
          - release
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-app:
    paths:
      - subsys/app/**
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - release
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-board:
    paths:
      - subsys/board/**
    samples:
      - scenario_prefix: sample.matter.contact_sensor
        variants:
          - release
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-binding:
    paths:
      - subsys/binding/**
    samples:
      - scenario_prefix: sample.matter.light_switch
        variants:
          - release
        platform:
          - nrf5340dk/nrf5340/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-clusters:
    paths:
      - subsys/clusters/**
    samples:
      - scenario_prefix: sample.matter.manufacturer_specific
        variants:
          - debug
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-certification:
    paths:
      - subsys/certification/**
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - certification
        platform:
          - nrf52840dk/nrf52840
          - nrf5340dk/nrf5340/cpuapp
          - nrf54l15dk/nrf54l15/cpuapp

  subsys-migration:
    paths:
      - subsys/migration/**
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - release
          - smp_dfu
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-persistent-storage:
    paths:
      - subsys/persistent_storage/**
    samples:
      - scenario_prefix: sample.matter.closure
        variants:
          - release
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-event-triggers:
    paths:
      - subsys/event_triggers/**
    samples:
      - scenario_prefix: sample.matter.smoke_co_alarm
        variants:
          - release
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-dfu-ota:
    paths:
      - subsys/dfu/ota/**
    samples:
      - scenario_prefix: sample.matter.window_cover
        variants:
          - smp_dfu
        platform:
          - nrf5340dk/nrf5340/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-dfu-smp:
    paths:
      - subsys/dfu/smp/**
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - smp_dfu
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp
      - scenario_prefix: applications.matter_weather_station
        variants:
          - release
        platform:
          - thingy53/nrf5340/cpuapp
          - nrf54l15tag/nrf54l15/cpuapp

  subsys-test:
    paths:
      - subsys/test/**
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - debug
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  subsys-util:
    paths:
      - subsys/util/**
    samples:
      - scenario_prefix: applications.matter_bridge
        variants:
          - release
        platform:
          - nrf5340dk/nrf5340/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  watchdog:
    paths:
      - subsys/watchdog/**
    samples:
      - scenario_prefix: sample.matter.template
        variants:
          - release
        platform:
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp

  pwm:
    paths:
      - subsys/pwm/**
    samples:
      - scenario_prefix: sample.matter.light_bulb
